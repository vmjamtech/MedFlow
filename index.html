<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedFlow — Offline-First Mobile App</title>
  <script>
    // Tailwind CDN fallback for browser dev mode
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Mobile safe-area support */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <div id="app"></div>
  
  <script type="module">
    // This is a placeholder. The actual app is built by Vite and loaded from main.ts
    // In development (npm run dev): Vite HMR loads the TypeScript modules
    // In production (npm run build): Static HTML + JavaScript bundles are served by Capacitor webDir
    
    console.log('MedFlow App Initializing...');
    console.log('Version: 0.1.0');
    console.log('Platform:', navigator.platform);
    
    // Check if we're in Capacitor (native) or browser
    if (window.Capacitor) {
      console.log('✓ Capacitor detected — running as native Android app');
    } else {
      console.log('✓ Browser detected — running in development mode');
    }
  </script>
</body>
</html>

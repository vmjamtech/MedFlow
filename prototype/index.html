<!DOCTYPE html>
<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
    }
    /* Custom subtle scrollbar inside the phone screen */
    .phone-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .phone-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .phone-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-notification {
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastPop {
      0% { transform: translateY(16px) scale(0.95); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-toast {
      animation: toastPop 0.25s ease-out forwards;
    }
  </style>
</head>

    // ==========================================
    // 2. FORMATTING & CLINICAL HELPERS
    // ==========================================
    function formatMinutesTo12h(totalMins) {
      const wrapped = ((totalMins % 1440) + 1440) % 1440;
      const hrs24 = Math.floor(wrapped / 60);
      const mins = wrapped % 60;
      const ampm = hrs24 >= 12 ? 'PM' : 'AM';
      const hrs12 = hrs24 % 12 === 0 ? 12 : hrs24 % 12;
      return `${String(hrs12).padStart(2, '0')}:${String(mins).padStart(2, '0')} ${ampm}`;
    }

    function getTimeOfDayGroup(mins) {
      const wrapped = ((mins % 1440) + 1440) % 1440;
      if (wrapped < 12 * 60) return 'Morning';
      if (wrapped < 17 * 60) return 'Afternoon';
      return 'Evening';
    }

    function parse24hToMinutes(timeStr) {
      if (!timeStr) return 8 * 60;
      const [h, m] = timeStr.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function formatQuantity(qty, unit) {
      const plural = qty > 1 && !unit.endsWith('s') && unit !== 'ml' ? unit + 's' : unit;
      return `${qty} ${plural}`;
    }

    function formatSeconds(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderPillSVG(shape, colorKey, size = 34) {
      const palette = PILL_COLORS[colorKey] || PILL_COLORS.teal;
      if (shape === 'capsule') {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 36 36" fill="none">
            <rect x="6" y="12" width="24" height="12" rx="6" transform="rotate(-35 18 18)" fill="${palette.fill}"/>
            <path d="M18 18L26.5 12C29.2 10.1 32.8 10.8 34.6 13.5C36.4 16.2 35.7 19.8 33 21.6L24.5 27.6L18 18Z" transform="translate(-5.5 -2)" fill="${palette.accent}"/>
          </svg>`;
      }
      if (shape === 'oval') {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 36 36" fill="none">
            <ellipse cx="18" cy="18" rx="13" ry="8" transform="rotate(-25 18 18)" fill="${palette.fill}"/>
            <line x1="15" y1="12" x2="21" y2="24" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>`;
      }
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="11" fill="${palette.fill}"/>
          <line x1="11" y1="18" x2="25" y2="18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>`;
    }

    function getVitalStatus(type, log) {
      if (!log) return { label: 'No Data', badge: 'bg-slate-100 text-slate-600' };
      if (type === 'bp') {
        if (log.sys >= 140 || log.dia >= 90) return { label: 'High (Stage 2)', badge: 'bg-rose-100 text-rose-700' };
        if (log.sys >= 130 || log.dia >= 80) return { label: 'Elevated', badge: 'bg-amber-100 text-amber-700' };
        if (log.sys < 90 || log.dia < 60) return { label: 'Low', badge: 'bg-sky-100 text-sky-700' };
        return { label: 'Normal', badge: 'bg-emerald-100 text-emerald-700' };
      }
      if (type === 'sugar') {
        const val = log.valueMgDl;
        const isFasting = (log.context || '').toLowerCase().includes('fasting');
        if (val < 70) return { label: 'Low', badge: 'bg-sky-100 text-sky-700' };
        if (isFasting && val >= 126) return { label: 'High', badge: 'bg-rose-100 text-rose-700' };
        if (isFasting && val >= 100) return { label: 'Borderline', badge: 'bg-amber-100 text-amber-700' };
        if (!isFasting && val >= 180) return { label: 'High', badge: 'bg-rose-100 text-rose-700' };
        return { label: 'Normal', badge: 'bg-emerald-100 text-emerald-700' };
      }
      if (type === 'pulse') {
        if (log.value > 100) return { label: 'High', badge: 'bg-rose-100 text-rose-700' };
        if (log.value < 60) return { label: 'Low', badge: 'bg-sky-100 text-sky-700' };
        return { label: 'Normal', badge: 'bg-emerald-100 text-emerald-700' };
      }
      if (type === 'temp') {
        if (log.value >= 37.8) return { label: 'Fever', badge: 'bg-rose-100 text-rose-700' };
        if (log.value < 36.0) return { label: 'Low', badge: 'bg-sky-100 text-sky-700' };
        return { label: 'Normal', badge: 'bg-emerald-100 text-emerald-700' };
      }
      if (type === 'spo2') {
        if (log.value < 95) return { label: 'Low SpO2', badge: 'bg-rose-100 text-rose-700' };
        return { label: 'Optimal', badge: 'bg-emerald-100 text-emerald-700' };
      }
      return { label: 'Logged', badge: 'bg-slate-100 text-slate-700' };
    }

    function formatGlucoseValue(mgDl) {
      if (glucoseUnit === 'mmol/L') {
        return (mgDl / 18.0182).toFixed(1);
      }
      return Math.round(mgDl);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass = type === 'warning'
        ? 'bg-amber-900/95 text-amber-50 border-amber-700'
        : type === 'alert'
        ? 'bg-rose-900/95 text-rose-50 border-rose-700'
        : 'bg-slate-900/95 text-white border-slate-700';

      toast.className = `animate-toast ${bgClass} border px-3.5 py-2.5 rounded-2xl shadow-lg text-xs font-medium leading-snug backdrop-blur-md`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3200);
    }

    function triggerLockScreenNotification() {
      const nextPending = doses.find(d => d.status === 'pending');
      const banner = document.getElementById('push-banner');
      if (!nextPending) {

    // ==========================================
    // 4. CORE MEDICATION ACTIONS
    // ==========================================
    function takeScheduledDose(doseId, lateOffsetMinutes = 0) {
      const dose = doses.find(d => d.id === doseId);
      if (!dose || dose.status === 'taken') return;

      const med = medications.find(m => m.id === dose.medId);
      if (med.stockRemaining < med.doseQty) {
        showToast(`Not enough ${med.name} in cabinet! Refill stock first.`, 'warning');
        return;
      }

      const actualTakenMins = dose.scheduledMinutes + lateOffsetMinutes;
      dose.status = 'taken';
      dose.takenAtStr = formatMinutesTo12h(actualTakenMins);

      // Auto-deduct pieces from inventory
      med.stockRemaining = Math.max(0, Number((med.stockRemaining - med.doseQty).toFixed(2)));

      // Dynamic interval shifting if taken late on interval-based medication
      let shiftMessage = '';
      if (med.scheduleType === 'interval' && lateOffsetMinutes > 0) {
        const subsequentDoses = doses.filter(
          d => d.medId === med.id && d.status === 'pending' && d.scheduledMinutes > dose.scheduledMinutes
        );
        subsequentDoses.forEach((nextDose, idx) => {
          const newMins = actualTakenMins + med.intervalHours * 60 * (idx + 1);
          nextDose.scheduledMinutes = newMins;
          nextDose.shiftNote = `Auto-shifted +${lateOffsetMinutes}m to keep ${med.intervalHours}h spacing`;
        });
        if (subsequentDoses.length > 0) {
          shiftMessage = ` Next dose shifted to ${formatMinutesTo12h(subsequentDoses[0].scheduledMinutes)}.`;
        }
      }

      historyLogs.unshift({
        time: dose.takenAtStr,
        date: 'Nov 18',
        text: `Took ${med.name} ${med.strength} (${formatQuantity(med.doseQty, med.unit)})${lateOffsetMinutes > 0 ? ` • +${lateOffsetMinutes}m late` : ''}`
      });

      showToast(
        `✓ Logged ${formatQuantity(med.doseQty, med.unit)} of ${med.name}. ${med.stockRemaining} left.${shiftMessage}`,
        med.stockRemaining <= med.lowStockThreshold ? 'warning' : 'success'
      );

      renderApp();
    }

    function snoozeDose(doseId) {
      const dose = doses.find(d => d.id === doseId);
      if (!dose || dose.status !== 'pending') return;
      const med = medications.find(m => m.id === dose.medId);
      dose.scheduledMinutes += 15;
      dose.shiftNote = 'Snoozed +15 mins';
      showToast(`⏰ Snoozed ${med.name} to ${formatMinutesTo12h(dose.scheduledMinutes)}`);
      renderApp();
    }

    function takePrnDose(medId) {
      const med = medications.find(m => m.id === medId);
      if (!med) return;

      if (med.cooldownRemainingSeconds > 0) {
        showToast(`Cooldown active! Wait ${formatSeconds(med.cooldownRemainingSeconds)} before next dose.`, 'warning');
        return;
      }
      if (med.takenTodayCount >= med.maxPerDay) {
        showToast(`Daily safety limit (${med.maxPerDay} intakes/day) reached for ${med.name}!`, 'alert');
        return;
      }
      if (med.stockRemaining < med.doseQty) {
        showToast(`Out of stock for ${med.name}!`, 'warning');
        return;
      }

      med.takenTodayCount += 1;
      med.stockRemaining = Math.max(0, Number((med.stockRemaining - med.doseQty).toFixed(2)));
      med.cooldownRemainingSeconds = med.cooldownHours * 3600;

      historyLogs.unshift({
        time: formatMinutesTo12h(simulatedMinutesNow),
        date: 'Nov 18',
        text: `Logged PRN ${med.name} ${med.strength} (${formatQuantity(med.doseQty, med.unit)})`
      });

      startPrnTimerLoop();
      showToast(`✓ Logged PRN ${med.name}. ${med.cooldownHours}h safety cooldown started.`);
      renderApp();
    }

    function skipPrnCooldown(medId) {
      const med = medications.find(m => m.id === medId);
      if (med) {
        med.cooldownRemainingSeconds = 0;
        showToast(`⏩ Fast-forwarded ${med.name} cooldown timer for testing.`);
        renderApp();
      }
    }

    function startPrnTimerLoop() {
      if (prnTimerInterval) clearInterval(prnTimerInterval);
      prnTimerInterval = setInterval(() => {
        let anyActive = false;
        medications.forEach(m => {
          if (m.scheduleType === 'prn' && m.cooldownRemainingSeconds > 0) {
            m.cooldownRemainingSeconds -= 1;
            anyActive = true;
          }
        });
        if (anyActive && currentTab === 'today') {
          renderApp();
        } else if (!anyActive) {
          clearInterval(prnTimerInterval);
          prnTimerInterval = null;
        }
      }, 1000);
    }

    function refillMedication(medId, addQty = 30) {
      const med = medications.find(m => m.id === medId);
      if (!med) return;
      med.stockRemaining = Number((med.stockRemaining + addQty).toFixed(2));
      med.stockTotal = Math.max(med.stockTotal, med.stockRemaining);
      showToast(`📦 Refilled +${addQty} ${med.unit}s of ${med.name} (Total: ${med.stockRemaining})`);
      renderApp();
    }

    function handleLogVitalSubmit(e) {
      e.preventDefault();

      const context = document.getElementById('vital-context-input')?.value || 'Resting';
      const note = document.getElementById('vital-note-input')?.value.trim() || '';
      const timeStr = formatMinutesTo12h(simulatedMinutesNow);
      const dateStr = '2026-11-18';
      const dateLabel = `Today, ${timeStr}`;

      if (type === 'bp') {
        const sys = parseInt(document.getElementById('vital-bp-sys').value, 10);
        const dia = parseInt(document.getElementById('vital-bp-dia').value, 10);
        const pulseOpt = parseInt(document.getElementById('vital-bp-pulse').value, 10);

        vitalLogs.unshift({
          id: 'v-' + Date.now(),
          type: 'bp',
          sys,
          dia,
          pulse: isNaN(pulseOpt) ? null : pulseOpt,
          date: dateStr,
          dateLabel,
          context,
          note
        });

        if (!isNaN(pulseOpt)) {
          vitalLogs.unshift({
            id: 'v-p-' + Date.now(),
            type: 'pulse',
            value: pulseOpt,
            date: dateStr,
            dateLabel,
            context: 'With BP reading',
            note
          });
        }
        selectedTrendVital = 'bp';
        showToast(`❤️ Logged BP: ${sys}/${dia} mmHg`);

        const rawVal = parseFloat(document.getElementById('vital-sugar-val').value);
        const unit = document.getElementById('vital-sugar-unit').value;
        const valueMgDl = unit === 'mmol/L' ? Math.round(rawVal * 18.0182) : rawVal;

          id: 'v-' + Date.now(),
          type: 'sugar',
          valueMgDl,
          date: dateStr,
          dateLabel,
          context,
          note
        });

    function handleAddMedication(e) {
      e.preventDefault();
      const name = document.getElementById('add-med-name').value.trim();
      const strength = document.getElementById('add-med-strength').value.trim();
      const shape = document.getElementById('add-med-shape').value;
      const color = document.getElementById('add-med-color').value;
      const doseQty = parseFloat(document.getElementById('add-med-qty').value) || 1;
      const unit = document.getElementById('add-med-unit').value;
      const stockTotal = parseFloat(document.getElementById('add-med-stock').value) || 30;
      const mealRequired = document.getElementById('add-meal-required').value;
      const mealTiming = document.getElementById('add-meal-timing')?.value || 'Before Meal';
      const mealTag = mealRequired === 'with_meal' ? mealTiming : 'No Meal Necessary';
      const scheduleType = document.getElementById('add-schedule-type').value;

      const newMedId = 'med-' + Date.now();
      const newMed = {
        id: newMedId,
        name,
        strength,
        shape,
        color,
        doseQty,
        unit,
        scheduleType,
        mealTag,
        instruction: `${mealTag} • ${formatQuantity(doseQty, unit)}`,
        stockRemaining: stockTotal,
        stockTotal,
        lowStockThreshold: Math.max(3, Math.round(stockTotal * 0.2))
      };

      if (scheduleType === 'fixed') {
        const timeStr = document.getElementById('add-fixed-time')?.value || '09:00';
        const mins = parse24hToMinutes(timeStr);
        newMed.fixedTimes = [timeStr];
        doses.push({
          id: 'dose-' + Date.now(),
          medId: newMedId,
          scheduledMinutes: mins,
          originalMinutes: mins,
          status: 'pending',
          takenAtStr: null,
          shiftNote: null
        });
      } else if (scheduleType === 'interval') {
        const startStr = document.getElementById('add-interval-start')?.value || '08:00';
        const intervalHrs = parseInt(document.getElementById('add-interval-hours')?.value || '8', 10);
        const startMins = parse24hToMinutes(startStr);
        newMed.intervalHours = intervalHrs;
        newMed.instruction = `Starts ${formatMinutesTo12h(startMins)} • Every ${intervalHrs}h`;

        let currentMins = startMins;
        let idx = 0;
        while (currentMins < 24 * 60 && idx < 4) {
          doses.push({
            id: `dose-${Date.now()}-${idx}`,
            medId: newMedId,
            scheduledMinutes: currentMins,
            originalMinutes: currentMins,
            status: 'pending',
            takenAtStr: null,
            shiftNote: null
          });
          currentMins += intervalHrs * 60;
          idx += 1;
        }
      } else {
        const cooldown = parseInt(document.getElementById('add-cooldown')?.value || '4', 10);
        const maxDay = parseInt(document.getElementById('add-maxday')?.value || '4', 10);
        newMed.cooldownHours = cooldown;
        newMed.maxPerDay = maxDay;
        newMed.takenTodayCount = 0;
        newMed.cooldownRemainingSeconds = 0;
        newMed.instruction = `Max ${maxDay}/day • ${cooldown}h cooldown`;
      }

      medications.push(newMed);
      closeModal();
      showToast(`✓ Added ${name} ${strength} to regimen!`);
      renderApp();
    }

                          <p class="text-[11px] text-slate-500 mt-1">${med.instruction}</p>
                        </div>
                      </div>

                      <div class="text-right shrink-0">

                          ${timeLabel}
                        </span>
                        ${isTaken ? `<p class="text-[10px] font-semibold text-emerald-600 mt-1">✓ ${dose.takenAtStr}</p>` : ''}

                    </div>

                    ${dose.shiftNote ? `
                      <div class="mt-3 bg-amber-50 border border-amber-200/80 rounded-2xl px-3 py-2 flex items-center gap-2 text-[11px] font-medium text-amber-800">
                        <span>⏱️</span>
                        <span>${dose.shiftNote}</span>

                    ${!isTaken ? `

                          ✓ Take Now
                        </button>

                          <button onclick="takeScheduledDose('${dose.id}', 90)" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-[11px] font-semibold py-2 px-2.5 rounded-xl transition active:scale-95">

                          Snooze
                        </button>

      if (prnMeds.length > 0) {
        html += `
          <section class="space-y-2.5 pt-1">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">

                const qtyLabel = formatQuantity(med.doseQty, med.unit);
                const inCooldown = med.cooldownRemainingSeconds > 0;
                const limitReached = med.takenTodayCount >= med.maxPerDay;
                const colorObj = PILL_COLORS[med.color] || PILL_COLORS.amber;

                return `
                  <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm">
                    <div class="flex items-start justify-between gap-2.5">
                      <div class="flex items-start gap-3 min-w-0">
                        <div class="w-10 h-10 rounded-2xl ${colorObj.bg} flex items-center justify-center shrink-0">

                        </div>
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5 flex-wrap">

                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${med.strength}</span>

                          <p class="text-xs font-bold text-brand-700 mt-0.5">${qtyLabel} per intake</p>
                          <p class="text-[11px] text-slate-500 mt-0.5">${med.instruction}</p>
                        </div>
                      </div>
                      <span class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-xl shrink-0 ${limitReached ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'}">
                        ${med.takenTodayCount} / ${med.maxPerDay} today
                      </span>
                    </div>

                    ${inCooldown ? `
                      <div class="mt-3 bg-slate-900 text-white rounded-2xl p-3 flex items-center justify-between">
                        <div>
                          <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Safety Cooldown Active</p>

                      </div>

                      <div class="mt-3.5 pt-3 border-t border-slate-100">
                        <button onclick="takePrnDose('${med.id}')" ${limitReached ? 'disabled' : ''} class="w-full ${limitReached ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-900 hover:bg-slate-800 text-white'} text-xs font-semibold py-2.5 rounded-xl transition active:scale-95">
                          ${limitReached ? 'Daily Maximum Reached' : `+ Log PRN Dose (${qtyLabel})`}
                        </button>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }

      return html;
    }

    function renderVitalsTrendChart() {
      const logs = vitalLogs.filter(v => v.type === selectedTrendVital).slice(0, 7).reverse();
      if (logs.length < 2) {
        return `<div class="h-28 flex items-center justify-center text-xs text-slate-400">Log at least 2 readings to view trend graph</div>`;
      }

      const width = 310;
      const height = 105;
      const padX = 22;
      const padY = 18;

      if (selectedTrendVital === 'bp') {
        const allVals = logs.flatMap(l => [l.sys, l.dia]);
        const minV = Math.min(...allVals) - 8;
        const maxV = Math.max(...allVals) + 8;
        const getX = idx => padX + (idx / (logs.length - 1)) * (width - padX * 2);
        const getY = val => height - padY - ((val - minV) / (maxV - minV || 1)) * (height - padY * 2);

        const sysPoints = logs.map((l, i) => `${getX(i)},${getY(l.sys)}`).join(' ');
        const diaPoints = logs.map((l, i) => `${getX(i)},${getY(l.dia)}`).join(' ');

        return `
          <svg viewBox="0 0 ${width} ${height}" class="w-full h-28 overflow-visible">
            <polyline fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${sysPoints}" />
            <polyline fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${diaPoints}" />
            ${logs.map((l, i) => `
              <circle cx="${getX(i)}" cy="${getY(l.sys)}" r="3.5" fill="#e11d48" />
              <text x="${getX(i)}" y="${getY(l.sys) - 6}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#be123c">${l.sys}</text>
              <circle cx="${getX(i)}" cy="${getY(l.dia)}" r="3.5" fill="#0284c7" />
              <text x="${getX(i)}" y="${getY(l.dia) + 12}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">${l.dia}</text>
            `).join('')}
          </svg>
          <div class="flex items-center justify-center gap-4 text-[10px] font-bold mt-1">
            <span class="text-rose-600 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-600"></span> Systolic</span>
            <span class="text-sky-600 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-600"></span> Diastolic</span>
          </div>
        `;
      }

      const values = logs.map(l => selectedTrendVital === 'sugar' ? Number(formatGlucoseValue(l.valueMgDl)) : Number(l.value));
      const minV = Math.min(...values) - (selectedTrendVital === 'sugar' && glucoseUnit === 'mmol/L' ? 0.5 : 5);
      const maxV = Math.max(...values) + (selectedTrendVital === 'sugar' && glucoseUnit === 'mmol/L' ? 0.5 : 5);
      const getX = idx => padX + (idx / (logs.length - 1)) * (width - padX * 2);
      const getY = val => height - padY - ((val - minV) / (maxV - minV || 1)) * (height - padY * 2);
      const points = values.map((v, i) => `${getX(i)},${getY(v)}`).join(' ');
      const strokeColor = selectedTrendVital === 'sugar' ? '#d97706' : '#0d9488';

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-28 overflow-visible">
          <polyline fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points}" />
          ${values.map((v, i) => `
            <circle cx="${getX(i)}" cy="${getY(v)}" r="3.5" fill="${strokeColor}" />
            <text x="${getX(i)}" y="${getY(v) - 7}" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">${v}</text>
          `).join('')}
        </svg>
      `;
    }

              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <div class="w-9 h-9 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-base font-bold shrink-0">❤️</div>
                  <div>
                    <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Blood Pressure</p>
                    <div class="flex items-baseline gap-1.5 mt-0.5">
                      <span class="text-lg font-extrabold text-slate-900">${latestBp ? `${latestBp.sys}/${latestBp.dia}` : '--/--'}</span>
                      <span class="text-[11px] font-medium text-slate-400">mmHg</span>
                    </div>

                </div>
                <div class="text-right shrink-0">
                  <span class="inline-block text-[10px] font-bold px-2.5 py-0.5 rounded-full ${bpStatus.badge}">${bpStatus.label}</span>
                  <p class="text-[10px] text-slate-400 mt-1">${latestBp ? latestBp.dateLabel : 'No reading'}</p>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div onclick="selectTrendVital('sugar')" class="cursor-pointer bg-white rounded-3xl p-3.5 border ${selectedTrendVital === 'sugar' ? 'border-brand-500 ring-2 ring-brand-500/15' : 'border-slate-200/80'} shadow-sm transition flex flex-col justify-between">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-sm">🩸</span>
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${sugarStatus.badge}">${sugarStatus.label}</span>
                </div>
                <div>
                  <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Blood Sugar</p>
                  <p class="text-base font-extrabold text-slate-900 mt-0.5">${latestSugar ? `${formatGlucoseValue(latestSugar.valueMgDl)} ${glucoseUnit}` : '--'}</p>
                  <p class="text-[10px] text-slate-500 mt-0.5 truncate">${latestSugar ? latestSugar.context : 'Tap to log'}</p>
                </div>
              </div>

              <div onclick="selectTrendVital('pulse')" class="cursor-pointer bg-white rounded-3xl p-3.5 border ${selectedTrendVital === 'pulse' ? 'border-brand-500 ring-2 ring-brand-500/15' : 'border-slate-200/80'} shadow-sm transition flex flex-col justify-between">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="w-8 h-8 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-sm">💓</span>
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${pulseStatus.badge}">${pulseStatus.label}</span>
                </div>
                <div>
                  <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Pulse Rate</p>
                  <p class="text-base font-extrabold text-slate-900 mt-0.5">${latestPulse ? `${latestPulse.value} <span class="text-xs font-medium text-slate-400">bpm</span>` : '--'}</p>
                  <p class="text-[10px] text-slate-500 mt-0.5 truncate">${latestPulse ? latestPulse.context : 'Tap to log'}</p>

              <div class="bg-slate-100 p-0.5 rounded-xl flex items-center text-[10px] font-bold shrink-0">

                <button onclick="setVitalsViewMode('printable')" class="px-2.5 py-1 rounded-lg transition ${vitalsViewMode === 'printable' ? 'bg-white text-brand-700 shadow-2xs' : 'text-slate-500'}">Printable List</button>
              </div>

            <!-- Date Range Filter & Quick Presets -->
            <div class="bg-slate-50 rounded-2xl p-2.5 border border-slate-200/80 space-y-2">

    function renderCabinetTab() {
      const cardsHtml = medications.map(med => {
        const pct = Math.min(100, Math.round((med.stockRemaining / med.stockTotal) * 100));
        const dailyUsage = med.scheduleType === 'fixed'
          ? (med.fixedTimes?.length || 1) * med.doseQty
          : med.scheduleType === 'interval'
          ? Math.max(1, Math.floor(24 / med.intervalHours)) * med.doseQty
          : med.doseQty;
        const daysLeft = dailyUsage > 0 ? Math.floor(med.stockRemaining / dailyUsage) : 0;
        const isLow = med.stockRemaining <= med.lowStockThreshold || (med.scheduleType !== 'prn' && daysLeft <= 5);
        const colorObj = PILL_COLORS[med.color] || PILL_COLORS.teal;

        return `
          <div class="bg-white rounded-3xl p-4 border ${isLow ? 'border-amber-300 ring-2 ring-amber-500/10' : 'border-slate-200/80'} shadow-sm space-y-3">
            <div class="flex items-start justify-between gap-2.5">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-2xl ${colorObj.bg} flex items-center justify-center shrink-0">
                  ${renderPillSVG(med.shape, med.color, 26)}
                </div>
                <div class="min-w-0">
                  <h3 class="font-bold text-slate-900 text-sm truncate">${med.name} <span class="text-xs font-medium text-slate-500">${med.strength}</span></h3>
                  <p class="text-xs font-semibold ${isLow ? 'text-amber-700' : 'text-slate-600'} mt-0.5">
                    ${med.stockRemaining} / ${med.stockTotal} ${med.unit}s left
                  </p>
                </div>
              </div>
              <button onclick="refillMedication('${med.id}', 30)" class="bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 text-xs font-bold px-2.5 py-1.5 rounded-xl transition active:scale-95 shrink-0">
                + Refill
              </button>
            </div>

            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full ${isLow ? 'bg-amber-500' : 'bg-brand-500'} rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>

            <div class="flex items-center justify-between text-[11px] gap-2">
              <span class="text-slate-400">Dose: ${formatQuantity(med.doseQty, med.unit)}</span>
              ${isLow ? `
                <span class="font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-lg">
                  ⚠️ Low (${daysLeft}d left)
                </span>
              ` : `
                <span class="font-medium text-emerald-600">✓ ~${daysLeft} days left</span>
              `}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-3">
          <div class="bg-brand-50 border border-brand-200/80 rounded-2xl p-3.5 flex items-center gap-3">
            <span class="text-xl shrink-0">📦</span>
            <p class="text-xs text-brand-900 leading-relaxed">
              Every time you log a dose, MedFlow automatically deducts exact pieces and calculates days remaining.
            </p>
          </div>
          ${cardsHtml}
        </div>
      `;
    }

    function renderGuardianTab() {
      const activeAlerts = guardianAlerts.filter(a => !a.acknowledged);

      return `
        <div class="space-y-3.5">
          <!-- Dual-Mode Switcher -->
          <div class="bg-slate-200/80 p-1 rounded-2xl grid grid-cols-2 gap-1 text-[11px] font-bold">
            <button onclick="setGuardianSubView('monitoring')" class="py-2 px-2 rounded-xl transition truncate ${guardianSubView === 'monitoring' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">
              Family (${monitoredPatients.length})
            </button>
            <button onclick="setGuardianSubView('mycode')" class="py-2 px-2 rounded-xl transition truncate ${guardianSubView === 'mycode' ? 'bg-white text-brand-700 shadow-xs' : 'text-slate-600'}">
              My Patient Code
            </button>
          </div>

          ${guardianSubView === 'mycode' ? `
            <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-4">
              <div class="text-center space-y-1.5">
                <span class="inline-block text-[10px] font-bold uppercase tracking-wider bg-brand-50 text-brand-700 px-2.5 py-1 rounded-full">Patient Sharing Mode</span>
                <h3 class="text-base font-extrabold text-slate-900">Your Pairing Invite Code</h3>
                <p class="text-xs text-slate-500 leading-relaxed">Share this code with a family member so they receive discreet alerts if any of your scheduled meds go unlogged 1 hour past window.</p>
              </div>

              <div class="bg-slate-900 text-white rounded-2xl p-4 text-center">
                <p class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Unique Device Sync Code</p>
                <p class="text-2xl font-mono font-extrabold tracking-widest text-brand-400 mt-1">${myPatientCode}</p>
                <button onclick="copyPatientCode()" class="mt-3 bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-4 py-2 rounded-xl transition active:scale-95">
                  📋 Copy Invite Code
                </button>
              </div>

              <div class="flex items-center justify-between gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-200">
                <div class="min-w-0">
                  <p class="text-xs font-bold text-slate-800">Escalate All Missed Meds</p>
                  <p class="text-[11px] text-slate-500">Notify Guardians 1h after any unlogged dose</p>
                </div>
                <button type="button" onclick="toggleGuardianSync()" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${guardianSyncEnabled ? 'bg-brand-600' : 'bg-slate-300'}">
                  <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-xs transition duration-200 ease-in-out ${guardianSyncEnabled ? 'translate-x-5' : 'translate-x-0'}"></span>
                </button>
              </div>
            </div>
          ` : `
            <!-- Active 1-Hour Missed Medication Escalations -->
            ${activeAlerts.length > 0 ? `
              <div class="space-y-2">
                <h3 class="text-[11px] font-bold uppercase tracking-wider text-rose-600 px-1">🚨 Missed Med Escalations (1h+ Overdue)</h3>
                ${activeAlerts.map(a => `
                  <div class="bg-rose-50 border border-rose-200 rounded-3xl p-3.5 space-y-2.5">
                    <div>
                      <p class="text-xs font-extrabold text-rose-900">${a.patientName} • Unlogged Dose</p>
                      <p class="text-xs font-semibold text-rose-800 mt-0.5">${a.medName}</p>
                      <p class="text-[11px] text-rose-600 mt-0.5">Scheduled ${a.scheduledTime} (${a.overdueBy})</p>
                    </div>
                    <button onclick="acknowledgeGuardianAlert('${a.id}')" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-2 rounded-xl transition active:scale-95">
                      ✓ Acknowledge Alert
                    </button>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <!-- Connect New Patient via Code -->
            <form onsubmit="linkNewPatientByCode(event)" class="bg-white rounded-3xl p-3.5 border border-slate-200/80 shadow-sm space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <label class="text-xs font-bold text-slate-800">+ Link Patient via Code</label>
                <button type="button" onclick="simulateGuardianMissedAlert()" class="text-[10px] font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-2 py-1 rounded-lg transition shrink-0">
                  Test Missed Alert
                </button>
              </div>
              <div class="flex items-center gap-2">
                <input id="guardian-code-input" type="text" placeholder="e.g. MED-5518" class="min-w-0 flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono font-bold uppercase focus:outline-none focus:border-brand-500" />
                <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition active:scale-95 shrink-0">
                  Link
                </button>
              </div>
            </form>

            <!-- Monitored Patients List -->
            <div class="space-y-3">
              ${monitoredPatients.map(pat => `
                <div class="bg-white rounded-3xl p-3.5 border ${pat.status === 'overdue' ? 'border-rose-300' : 'border-slate-200/80'} shadow-sm space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <h4 class="text-sm font-bold text-slate-900">${pat.name}</h4>
                        <span class="text-[10px] font-mono font-bold bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${pat.code}</span>
                      </div>
                      <p class="text-[11px] text-slate-500 mt-0.5">${pat.relation} • Synced ${pat.lastSync}</p>
                    </div>
                    <span class="text-[11px] font-extrabold shrink-0 ${pat.status === 'overdue' ? 'text-rose-700 bg-rose-50' : 'text-emerald-700 bg-emerald-50'} px-2.5 py-1 rounded-xl">
                      ${pat.adherence}% Adh.
                    </span>
                  </div>

                  <div class="divide-y divide-slate-100 border-t border-slate-100 pt-1">
                    ${pat.meds.map(m => `
                      <div class="py-1.5 flex items-center justify-between gap-2 text-xs">
                        <div class="min-w-0 truncate">
                          <span class="font-semibold text-slate-800">${m.name}</span>
                          <span class="text-slate-400 text-[11px]"> (${m.qty})</span>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg shrink-0 ${
                          m.status === 'taken'
                            ? 'bg-emerald-50 text-emerald-700'
                            : m.status === 'missed_1h'
                            ? 'bg-rose-100 text-rose-700'
                            : 'bg-slate-100 text-slate-600'
                        }">
                          ${m.status === 'taken' ? `✓ ${m.time}` : m.status === 'missed_1h' ? `⚠️ Missed (${m.time})` : m.time}
                        </span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderReportTab() {
      const takenCount = doses.filter(d => d.status === 'taken').length;
      const adherencePct = doses.length > 0 ? Math.round((takenCount / doses.length) * 100) : 100;

      const bpLogs = vitalLogs.filter(v => v.type === 'bp');
      const avgSys = bpLogs.length ? Math.round(bpLogs.reduce((acc, v) => acc + v.sys, 0) / bpLogs.length) : 120;
      const avgDia = bpLogs.length ? Math.round(bpLogs.reduce((acc, v) => acc + v.dia, 0) / bpLogs.length) : 78;

      const sugarLogs = vitalLogs.filter(v => v.type === 'sugar');
      const avgSugarMg = sugarLogs.length ? Math.round(sugarLogs.reduce((acc, v) => acc + v.valueMgDl, 0) / sugarLogs.length) : 105;

      const pulseLogs = vitalLogs.filter(v => v.type === 'pulse');
      const avgPulse = pulseLogs.length ? Math.round(pulseLogs.reduce((acc, v) => acc + v.value, 0) / pulseLogs.length) : 74;

      return `
        <div class="space-y-4">
          <div class="bg-slate-900 text-white rounded-3xl p-4 space-y-3 shadow-sm">
            <div class="flex items-start justify-between gap-3">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-brand-400">Clinician Summary</span>
                <h2 class="text-base font-bold mt-0.5">7-Day Adherence & Vitals</h2>
                <p class="text-[11px] text-slate-300 mt-0.5">Correlates medication intake with blood pressure & glucose response.</p>
              </div>
              <span class="text-2xl shrink-0">📋</span>
            </div>
            <button onclick="showToast('📄 Generated MedFlow_Clinician_Report_Nov18.pdf')" class="w-full bg-brand-500 hover:bg-brand-400 text-slate-950 text-xs font-extrabold py-2.5 rounded-xl transition active:scale-95 flex items-center justify-center gap-1.5">
              <span>📄 Export PDF Report for Doctor</span>
            </button>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-white rounded-3xl p-3.5 border border-slate-200/80 shadow-sm">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Today Adherence</p>
              <p class="text-xl font-extrabold text-brand-600 mt-1">${adherencePct}%</p>
              <p class="text-[10px] text-slate-500 mt-0.5">${takenCount}/${doses.length} doses taken</p>
            </div>
            <div class="bg-white rounded-3xl p-3.5 border border-slate-200/80 shadow-sm">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Avg Blood Pressure</p>
              <p class="text-xl font-extrabold text-slate-900 mt-1">${avgSys}/${avgDia}</p>
              <p class="text-[10px] text-slate-500 mt-0.5">${bpLogs.length} readings (mmHg)</p>
            </div>
            <div class="bg-white rounded-3xl p-3.5 border border-slate-200/80 shadow-sm">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Avg Blood Sugar</p>
              <p class="text-xl font-extrabold text-slate-900 mt-1">${formatGlucoseValue(avgSugarMg)} ${glucoseUnit}</p>
              <p class="text-[10px] text-slate-500 mt-0.5">${sugarLogs.length} glucose logs</p>
            </div>
            <div class="bg-white rounded-3xl p-3.5 border border-slate-200/80 shadow-sm">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Avg Resting Pulse</p>
              <p class="text-xl font-extrabold text-slate-900 mt-1">${avgPulse} bpm</p>
              <p class="text-[10px] text-slate-500 mt-0.5">${pulseLogs.length} pulse logs</p>
            </div>
          </div>

          <div class="space-y-2.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Recent Intake Activity Log</h3>
            ${historyLogs.map(item => `
              <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm flex items-start gap-3">
                <div class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-sm font-bold shrink-0">✓</div>
                <div class="flex-1 min-w-0">
                  <p class="text-xs font-bold text-slate-900">${item.text}</p>
                  <p class="text-[10px] font-medium text-slate-400 mt-1">${item.date} • ${item.time}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // 9. MASTER RENDER & INITIALIZATION
    // ==========================================
    function renderApp() {
      const takenCount = doses.filter(d => d.status === 'taken').length;
      const totalScheduled = doses.length;

      document.getElementById('status-clock').textContent = formatMinutesTo12h(simulatedMinutesNow);
      document.getElementById('adherence-pill').textContent = `${takenCount} / ${totalScheduled} Taken`;

      const hasLowStock = medications.some(m => m.stockRemaining <= m.lowStockThreshold);
      document.getElementById('low-stock-dot').classList.toggle('hidden', !hasLowStock);

      const hasGuardianAlerts = guardianAlerts.some(a => !a.acknowledged);
      document.getElementById('guardian-alert-dot').classList.toggle('hidden', !hasGuardianAlerts);

      const headerTitle = document.getElementById('header-title');
      const headerSubtitle = document.getElementById('header-subtitle');
      const headerBadge = document.getElementById('header-badge');
      const addFab = document.getElementById('add-med-fab');
      const mainContent = document.getElementById('main-content');

      // Show adherence badge and '+' Add Med FAB only on Today & Cabinet tabs
      const showMedControls = currentTab === 'today' || currentTab === 'cabinet';
      headerBadge.classList.toggle('hidden', currentTab !== 'today');
      if (addFab) addFab.classList.toggle('hidden', !showMedControls);

      if (currentTab === 'today') {
        headerSubtitle.textContent = 'Wednesday, Nov 18';
        headerTitle.textContent = "Today's Regimen";
        mainContent.innerHTML = renderTodayTab();
      } else if (currentTab === 'vitals') {
        headerSubtitle.textContent = 'Biometrics & Symptom Tracker';
        headerTitle.textContent = 'Vital Signs';
        mainContent.innerHTML = renderVitalsTab();
      } else if (currentTab === 'cabinet') {
        headerSubtitle.textContent = 'Smart Piece Counter';
        headerTitle.textContent = 'Medicine Cabinet';
        mainContent.innerHTML = renderCabinetTab();
      } else if (currentTab === 'guardian') {
        headerSubtitle.textContent = 'Family & Caregiver Sync';
        headerTitle.textContent = 'Guardian Mode';
        mainContent.innerHTML = renderGuardianTab();
      } else if (currentTab === 'report') {
        headerSubtitle.textContent = 'Doctor Visit Summary';
        headerTitle.textContent = 'Health Report';
        mainContent.innerHTML = renderReportTab();
      }
    }

    function resetDemoData() {
      if (prnTimerInterval) clearInterval(prnTimerInterval);
      getInitialState();
      dismissPushBanner();
      closeModal();
      renderApp();
      showToast('🔄 Demo data reset to initial sample regimen!');
    }

    window.onload = function () {
      getInitialState();
      renderApp();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="min-h-screen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedFlow — Offline-First Mobile App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      min-height: 100vh;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
    }
    
    /* Mobile safe-area support */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }

    /* Status Bar / Header */
    #app-header {
      background: white;
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    /* Main Content Area */
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Toast Container */
    #toast-container {
      position: absolute;
      bottom: 5rem;
      left: 1rem;
      right: 4rem;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    /* Modal Backdrop */
    #modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    #modal-backdrop.hidden {
      display: none;
    }

    #modal-sheet {
      background: white;
      border-radius: 32px 32px 0 0;
      max-height: 88%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border-top: 1px solid #e2e8f0;
      overflow: hidden;
    }

    /* Navigation Bar */
    nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(226, 232, 240, 0.8);
      padding: 0.5rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.125rem;
      flex-shrink: 0;
      z-index: 30;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
      color: #94a3b8;
    }

    .nav-btn.text-brand-600 {
      color: #0d9488;
    }

    /* Add Medication FAB */
    #add-med-fab {
      position: absolute;
      bottom: 5rem;
      right: 1rem;
      z-index: 30;
      width: 3rem;
      height: 3rem;
      border-radius: 0.5rem;
      background: #0d9488;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(13, 148, 136, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #add-med-fab:hover {
      background: #0f766e;
    }

    #add-med-fab.hidden {
      display: none;
    }

    /* Animations */
    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slideUp {
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .animate-toast {
      animation: slideUp 0.25s ease-out;
    }
  </style>
</head>
<body>
  <div id="app" class="flex flex-col min-h-screen bg-slate-50">
    <!-- App Header -->
    <header id="app-header" class="bg-white px-5 pt-2 pb-3.5 border-b border-slate-100 shrink-0">
      <div class="flex items-center justify-between">
        <div>
          <p id="header-subtitle" class="text-xs font-medium text-brand-600">Wednesday, Nov 18</p>
          <h1 id="header-title" class="text-xl font-bold text-slate-900 tracking-tight">Today's Regimen</h1>
        </div>
        <div id="header-badge" class="bg-brand-50 border border-brand-200/70 px-3 py-1.5 rounded-2xl text-right">
          <span id="adherence-pill" class="text-xs font-bold text-brand-700">0 / 4 Taken</span>
        </div>
      </div>
    </header>

    <!-- Scrollable Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24">
      <!-- Dynamically injected tab content -->
    </main>

    <!-- Floating Add Medication (+) FAB -->
    <button id="add-med-fab" onclick="openAddMedModal()" title="Add Medication" class="absolute bottom-20 right-4 z-30 w-12 h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-600/30 flex items-center justify-center transition transform active:scale-95">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
    </button>

    <!-- Floating Toast Notification -->
    <div id="toast-container" class="pointer-events-none absolute bottom-20 left-4 right-16 z-40 flex flex-col items-start gap-2"></div>

    <!-- Bottom Navigation Bar (5 Tabs) -->
    <nav class="bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-1.5 py-2 grid grid-cols-5 gap-0.5 shrink-0 z-30">
      <button onclick="switchTab('today')" data-tab="today" class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-brand-600 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span class="text-[9px] font-semibold">Today</span>
      </button>

      <button onclick="switchTab('vitals')" data-tab="vitals" class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-slate-400 hover:text-slate-600 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span class="text-[9px] font-semibold">Vitals</span>
      </button>

      <button onclick="switchTab('cabinet')" data-tab="cabinet" class="nav-btn relative flex flex-col items-center justify-center py-1 px-1 rounded-xl text-slate-400 hover:text-slate-600 transition">
        <span id="low-stock-dot" class="hidden absolute top-1 right-3 w-2 h-2 bg-amber-500 rounded-full ring-2 ring-white"></span>
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span class="text-[9px] font-semibold">Cabinet</span>
      </button>

      <button onclick="switchTab('guardian')" data-tab="guardian" class="nav-btn relative flex flex-col items-center justify-center py-1 px-1 rounded-xl text-slate-400 hover:text-slate-600 transition">
        <span id="guardian-alert-dot" class="hidden absolute top-1 right-3 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-[9px] font-semibold">Guardian</span>
      </button>

      <button onclick="switchTab('report')" data-tab="report" class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-slate-400 hover:text-slate-600 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[9px] font-semibold">Report</span>
      </button>
    </nav>

    <!-- Modal Drawer Overlay -->
    <div id="modal-backdrop" class="hidden absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex flex-col justify-end">
      <div id="modal-sheet" class="bg-white rounded-t-[32px] max-h-[88%] flex flex-col shadow-2xl border-t border-slate-200 overflow-hidden">
        <div class="px-5 pt-3 pb-2.5 border-b border-slate-100 flex items-center justify-between shrink-0">
          <div>
            <p id="modal-subtitle" class="text-[11px] font-semibold text-brand-600 uppercase tracking-wider">Quick Entry</p>
            <h2 id="modal-title" class="text-base font-bold text-slate-900">Log Vital Sign</h2>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modal-body" class="p-5 overflow-y-auto phone-scroll space-y-4">
          <!-- Modal form injected here -->
        </div>
      </div>
    </div>

    <!-- Home Indicator Bar -->
    <div class="bg-white pb-1.5 pt-0.5 flex justify-center shrink-0">
      <div class="w-28 h-1 bg-slate-300 rounded-full"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
